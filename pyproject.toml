[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger"
version = "0.1.0"
description = "CLI tool for database backups — profiles, Rich UI, and cloud sync for PostgreSQL, MySQL, MongoDB, and SQLite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ledger Contributors" }]
keywords = ["backup", "database", "mysql", "postgresql", "mongodb", "cli", "ledger", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.12.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "apscheduler>=3.11.2,<4.0",
    "structlog>=24.0,<26.0",
    "rich>=13.0,<14.0",
    "textual>=0.79.0,<2.0",
    "cryptography>=42.0,<45.0",
    "PyMySQL>=1.1,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "pymongo>=4.6,<5.0",
    "boto3>=1.34,<2.0",
    "google-cloud-storage>=2.14,<3.0",
    "azure-storage-blob>=12.19,<13.0",
    "slack-sdk>=3.27,<4.0",
    "keyring>=25.0,<26.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
    "types-PyYAML",
    "types-requests",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=1.0.4,<2.0",
]

[project.scripts]
ledger = "cli.main:app"

[project.urls]
Homepage = "https://github.com/ledger-org/ledger"
Documentation = "https://ledger-org.github.io/ledger"
Repository = "https://github.com/ledger-org/ledger"
Changelog = "https://github.com/ledger-org/ledger/blob/main/CHANGELOG.md"
Issues = "https://github.com/ledger-org/ledger/issues"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/cli" = "cli"
"src/core" = "core"
"src/database" = "database"
"src/storage" = "storage"
"src/ui" = "ui"
"src/tui" = "tui"
"src/utils" = "utils"
"src/__init__.py" = "__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast tests with mocked subprocess boundaries",
    "integration: tests requiring live database containers",
    "slow: long-running tests (large file streaming, etc.)",
]

[tool.coverage.run]
source = ["cli", "core", "database", "storage", "ui", "tui", "utils"]
branch = true
omit = ["cli/main.py", "tui/app.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "core", "database", "storage", "ui", "tui", "utils"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"
packages = ["cli", "core", "database", "storage", "ui", "tui", "utils"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "boto3.*",
    "botocore.*",
    "google.cloud.*",
    "azure.*",
    "pymongo.*",
    "pymysql.*",
    "psycopg2.*",
    "textual.*",
]
ignore_missing_imports = true
